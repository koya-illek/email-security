name = "email-security-checker"
main = "worker.js"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "email.illek.ie", custom_domain = true },
  { pattern = "checker.illek.ie", custom_domain = true }
]

[assets]
directory = "./web"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"

# These counters are shared across Worker isolates within each Cloudflare
# serving location; they are not strict global quotas.
[[ratelimits]]
name = "STANDARD_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "EXPENSIVE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Optional: Enable Workers KV for persistent caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"
