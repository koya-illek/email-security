name = "email-security-checker"
main = "worker.js"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "email.illek.ie", custom_domain = true },
  { pattern = "checker.illek.ie", custom_domain = true }
]

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
# Releases must pin the real revision with `npm run deploy`, which overrides
# this variable via --var at deploy time. This fallback stays honest when
# someone deploys without the release script.
SOURCE_REVISION = "unpinned"
DAILY_POST_LIMIT = "500"
REPORT_DAILY_LIMIT = "120"

# Remove expired shareable reports on a regular schedule. Expired links stop
# working at expires_at even if the next cleanup invocation is still pending.
[triggers]
crons = ["17 * * * *"]

# These counters are shared across Worker isolates within each Cloudflare
# serving location; they are not strict global quotas.
[[ratelimits]]
name = "STANDARD_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "EXPENSIVE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# D1 database for shareable reports
[[d1_databases]]
binding = "DB"
database_name = "email-security-reports"
database_id = "0bf4a477-ec76-4b1c-a45f-4d2af62b6eec"

# Optional: Enable Workers KV for persistent caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"
