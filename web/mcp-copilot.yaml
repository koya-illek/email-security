swagger: '2.0'
info:
  title: Email Security Checker MCP
  description: Full read-only Email Security toolset for single and batch domain posture, SPF inspection and evaluation, SPF or DMARC validation, received-header analysis and hop enrichment, and stored-report retrieval. The Streamable HTTP endpoint negotiates MCP protocol versions 2025-11-25, 2025-06-18, and 2024-11-05. Reports include uncertainty and request-budget evidence; stored links are bearer links retained for 14 days and served privately. Full REST and result schemas are at https://email.illek.ie/openapi.yaml.
  version: 2.0.0
host: email.illek.ie
basePath: /
schemes: [https]
paths:
  /mcp/v2:
    post:
      summary: Email Security Checker tools
      description: Streamable HTTP MCP endpoint exposing nine tools. Each tool publishes its input and output JSON Schemas through tools/list.
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeEmailSecurityMCP
      consumes: [application/json]
      produces: [application/json, text/event-stream]
      responses:
        '200': { description: MCP response }
        '202': { description: MCP notification accepted }
